<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Otavio AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #1e293b;
      font-size: 24px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .message {
      margin: 10px 0;
      padding: 12px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.4;
    }

    .user {
      background: #2563eb;
      margin-left: auto;
    }

    .ai {
      background: #334155;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      padding: 10px;
      background: #1e293b;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>🤖 Otavio AI</header>

<div id="chat">
  <div class="message ai">
    Olá! Eu sou o Otavio AI. 👋<br>
    Como posso ajudar você?
  </div>
</div>

<div class="input-area">
  <input id="input" type="text" placeholder="Digite sua mensagem...">
  <button onclick="enviar()">Enviar</button>
</div>

<script>
  function enviar() {
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const texto = input.value.trim();

    if (!texto) return;

    const usuario = document.createElement("div");
    usuario.className = "message user";
    usuario.textContent = texto;
    chat.appendChild(usuario);

    input.value = "";

    const resposta = document.createElement("div");
    resposta.className = "message ai";

    resposta.textContent =
      "Recebi sua mensagem! Ainda estou sendo configurado. 🤖";

    chat.appendChild(resposta);

    chat.scrollTop = chat.scrollHeight;
  }

  document.getElementById("input").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      enviar();
    }
  });
</script>

</body>
</html>
